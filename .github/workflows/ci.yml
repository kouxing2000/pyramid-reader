name: CI

# Runs the test suite on pull requests and on direct pushes to master, so incoming
# contributions get a green/red signal before merge and any master breakage surfaces
# immediately instead of at release time. Needs no secrets; forked-PR runs get a read-only
# token by default, which is all this requires.
on:
  pull_request:
  push:
    branches: [master]
  # By hand (Actions tab, or `gh workflow run CI -f repeat=5`): run each E2E test several times, to
  # catch a test that fails only now and then on this runner.
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs of each E2E test
        default: '1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every `uses:` is pinned to a full commit SHA with the tag in a trailing comment: a tag is
    # mutable, a SHA is not. Dependabot (.github/dependabot.yml) moves the pins.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install tooling
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests
        # window.spec.js runs headed (playwright.config.js), which on Linux needs a display.
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
        run: xvfb-run -a npx playwright test --repeat-each="$REPEAT"
