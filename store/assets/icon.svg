<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128">
<!-- Pyramid Reader's icon: a summary in levels. The headline is cut out of the bubble; the two
     detail lines are half filled back in: there, not yet said. 128-unit canvas, motif inside
     16..112 (the tail reaches 114), i.e. Chrome's store icon with its 16 px transparent padding.
     src/icons/icon48.png and icon128.png are this file rendered at 48 and 128 px; icon16.png and
     icon32.png are rendered from viewBox "13 13 102 102" (a tight crop, so the toolbar motif is
     not 12 px wide). The panel header (src/panel/panel.html) draws the same paths in currentColor. -->
